<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Memories 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose:  #e8788a;
      --blush: #f5c6cf;
      --petal: #fdeef0;
      --cream: #fffaf8;
      --mauve: #c2576b;
      --text:  #3a1f24;
      --soft:  #8c4f5a;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      font-family: 'Lato', sans-serif;
      overflow-x: hidden;
    }

    .hearts-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .heart-float {
      position: absolute;
      bottom: -60px;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(-10deg); opacity: 0; }
      10%  { opacity: 0.55; }
      90%  { opacity: 0.35; }
      100% { transform: translateY(-110vh) rotate(10deg); opacity: 0; }
    }

    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2.5rem 1.5rem 3rem;
    }

    .card {
      background: #fff;
      border: 1.5px solid var(--blush);
      border-radius: 2rem;
      padding: 3.5rem 2.8rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(232,120,138,.13);
      text-align: center;
      animation: fadeIn .5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .cs-icon {
      font-size: 3.5rem;
      display: inline-block;
      animation: spin 6s linear infinite;
    }
    @keyframes spin {
      0%   { transform: rotate(0deg)   scale(1); }
      50%  { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .cs-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      color: var(--mauve);
      margin: 1rem 0 0.4rem;
    }
    .cs-title em {
      font-style: italic;
      color: var(--rose);
    }

    .cs-sub {
      font-size: 0.95rem;
      color: var(--soft);
      font-weight: 300;
      line-height: 1.7;
      margin-top: 0.8rem;
    }

    .cs-dots {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin: 1.8rem 0 0.5rem;
    }
    .cs-dots span {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--blush);
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .cs-dots span:nth-child(2) { animation-delay: .2s; }
    .cs-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dotPulse {
      0%,100% { background: var(--blush); transform: scale(1); }
      50%      { background: var(--rose);  transform: scale(1.35); }
    }

    .btn-back {
      margin-top: 2rem;
      padding: 0.6rem 1.6rem;
      border: 1.5px solid var(--blush);
      border-radius: 999px;
      font-size: 0.78rem;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--soft);
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background .2s, color .2s;
    }
    .btn-back:hover {
      background: var(--petal);
      color: var(--mauve);
    }

    .footer {
      margin-top: 2.2rem;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--blush);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<div class="page">
  <div class="card">
    <span class="cs-icon">📸</span>

    <h2 class="cs-title"><em>Coming</em> Soon</h2>

    <p class="cs-sub">
      Our memories are being gathered,<br>
      every photo, every moment, every smile —<br>
      all for you. Check back soon. 🌸
    </p>

    <div class="cs-dots">
      <span></span><span></span><span></span>
    </div>

    <a class="btn-back" href="index.html">← go back</a>
  </div>

  <p class="footer">made with love 💕</p>
</div>

<script>
  const emojis = ['💕','💗','💓','🌸','💝','✨','🌷','💞'];
  const bg = document.getElementById('heartsBg');
  for (let i = 0; i < 22; i++) {
    const h = document.createElement('span');
    h.className = 'heart-float';
    h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    h.style.left     = Math.random() * 100 + 'vw';
    h.style.fontSize = (0.9 + Math.random() * 1.3) + 'rem';
    h.style.animationDuration  = (7 + Math.random() * 9) + 's';
    h.style.animationDelay     = -(Math.random() * 12) + 's';
    bg.appendChild(h);
  }
</script>
</body>
</html>
